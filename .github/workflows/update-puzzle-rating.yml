name: Update Chess.com puzzle rating

on:
  push:
    branches:
      - main

  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chesscom-puzzle-rating
  cancel-in-progress: false

jobs:
  update-rating:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test tracker parsing logic
        run: python -m unittest discover -s tests -v

      - name: Fetch current puzzle rating and update chart
        env:
          CHESSCOM_USERNAME: praj-bhatt
        run: python scripts/update_tracker.py

      - name: Show collected rating
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          latest = json.loads(Path("data/latest_rating.json").read_text(encoding="utf-8"))
          print("## Chess.com puzzle rating updated")
          print(f"- **Username:** {latest['username']}")
          print(f"- **Current puzzle rating:** {latest['rating']}")
          print(f"- **Collected (UTC):** {latest['timestamp_utc']}")
          print("- **History:** `data/puzzle_rating_history.csv`")
          print("- **Graph:** `assets/puzzle-rating.png`")
          PY

      - name: Commit history and chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puzzle_rating_history.csv data/latest_rating.json assets/puzzle-rating.png
          if git diff --cached --quiet; then
            echo "No tracker files changed."
          else
            git commit -m "Update Chess.com puzzle rating history"
            git push
          fi
